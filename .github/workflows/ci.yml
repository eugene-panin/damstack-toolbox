---
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: [README.md, LICENSE]
  pull_request:
    paths-ignore: [README.md, LICENSE]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: native build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.3"

      - name: shellcheck
        run: shellcheck -x native/build.sh test/native.sh

      - name: Build for both kinds of Mac
        run: |
          version=0.0.0-${GITHUB_SHA::7}
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; fi
          for arch in arm64 amd64; do
            native/build.sh "$version" "$arch" dist
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' >SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: native
          path: dist/

  native-test:
    name: native test (darwin-${{ matrix.arch }})
    needs: native-build
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native
          path: dist/

      - name: Isolation and relocation test
        run: test/native.sh dist/damstack-toolbox-*-darwin-${{ matrix.arch }}.tar.gz </dev/null

  native-release:
    name: native release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: native
          path: dist/

      - name: Release the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "The native toolbox for Macs, arm64 and amd64 (under Rosetta too), with SHA256SUMS."
