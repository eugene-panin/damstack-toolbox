---
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: [README.md, LICENSE]
  pull_request:
    paths-ignore: [README.md, LICENSE]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/eugene-panin/damstack-toolbox

jobs:
  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: shellcheck entrypoint test/smoke.sh

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: damstack-toolbox:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: smoke test
        run: test/smoke.sh damstack-toolbox:test

  native-build:
    name: native build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.3"

      - name: shellcheck
        run: shellcheck -x native/build.sh test/native.sh

      - name: Build every platform
        run: |
          version=0.0.0-${GITHUB_SHA::7}
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; fi
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            native/build.sh "$version" "${platform%-*}" "${platform#*-}" dist
          done
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' >SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: native
          path: dist/

  native-test:
    name: native test (${{ matrix.platform }})
    needs: native-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-amd64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native
          path: dist/

      - name: Isolation and relocation test
        run: test/native.sh dist/damstack-toolbox-*-${{ matrix.platform }}.tar.gz </dev/null

  native-release:
    name: native release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, native-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: native
          path: dist/

      - name: Release the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "The native toolbox for darwin and linux, amd64 and arm64, with SHA256SUMS."

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "list=$IMAGE:$version,$IMAGE:${version%.*},$IMAGE:latest" >>"$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
